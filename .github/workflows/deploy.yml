name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ec2-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests/test_workflow.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd apps/web && npm ci && npm run typecheck
      - run: cd apps/admin && npm ci && npm run typecheck

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH to existing AWS EC2 instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "Set EC2_HOST, EC2_USER, and EC2_SSH_KEY in GitHub Repository Secrets to enable automated deployment."
            exit 1
          fi
          APP_DIR="${EC2_APP_DIR:-/opt/chatbot}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "bash -s" <<EOF
            set -euo pipefail
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            for i in \$(seq 1 20); do
              if docker compose -f docker-compose.prod.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" >/dev/null 2>&1; then
                echo "API healthy!"
                break
              fi
              sleep 3
            done
            docker image prune -f
          EOF
