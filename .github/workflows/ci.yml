name: AgentForge checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: services/api/requirements.txt}
      - run: pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  admin:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/admin}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/admin/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: agentforge, POSTGRES_PASSWORD: test-password, POSTGRES_DB: agentforge_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agentforge:test-password@localhost:5432/agentforge_test
